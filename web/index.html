<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Customer Support</title><style>body{font-family:Inter,Arial;background:#f6f7fb;margin:0}.app{max-width:760px;margin:50px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0001}textarea,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border:1px solid #ddd;border-radius:12px}button{cursor:pointer}.answer{margin-top:20px;background:#f1f5f9;padding:18px;border-radius:14px}</style></head><body><div class="app"><h1>AI Customer Support</h1><p>FAQ assistant with confidence and escalation.</p><textarea id="msg" rows="5" placeholder="How can I get a refund?"></textarea><button onclick="ask()">Send message</button><div id="out" class="answer">Ready.</div></div><script>async function ask(){let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg.value})});let x=await r.json();out.innerHTML='<b>'+x.reply+'</b><br><small>Intent: '+x.intent+' · Confidence: '+x.confidence+(x.escalate?' · Human escalation recommended':'')+'</small>'}</script></body></html>
